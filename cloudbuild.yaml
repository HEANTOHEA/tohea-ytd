steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/yt-music-downloader:$COMMIT_SHA', '.']

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/yt-music-downloader:$COMMIT_SHA']

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'yt-music-downloader'
      - '--image'
      - 'gcr.io/$PROJECT_ID/yt-music-downloader:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--port'
      - '3000'
      - '--memory'
      - '1Gi'
      - '--timeout'
      - '300'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/yt-music-downloader:$COMMIT_SHA'
